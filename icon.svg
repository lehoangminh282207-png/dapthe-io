<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B09" />
      <stop offset="100%" stop-color="#050706" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20F477" />
      <stop offset="100%" stop-color="#0FAE50" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16E36B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#16E36B" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Background Shield Card -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" stroke="#1a251e" stroke-width="8"/>
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="url(#glowGrad)" stroke-width="2"/>
  
  <!-- Outer D / Shield Form -->
  <path d="M 140 110 L 260 110 C 350 110 400 170 400 256 C 400 342 350 402 260 402 L 140 402 Z" 
        fill="#101512" stroke="#1c2b21" stroke-width="12"/>
        
  <!-- Glowing Upgrade Chevrons inside D -->
  <!-- Bottom Chevron (Base) -->
  <path d="M 190 350 L 256 295 L 322 350 L 296 350 L 256 316 L 216 350 Z" 
        fill="#0FAE50" />
  <!-- Middle Chevron -->
  <path d="M 190 290 L 256 235 L 322 290 L 296 290 L 256 256 L 216 290 Z" 
        fill="#16E36B" />
  <!-- Top Arrow (Peak) -->
  <path d="M 190 230 L 256 160 L 322 230 L 286 230 L 256 195 L 226 230 Z" 
        fill="url(#greenGrad)" filter="drop-shadow(0 0 12px rgba(32, 244, 119, 0.6))"/>
        
  <!-- Dynamic Lightning Bolt Notch on left stem -->
  <path d="M 140 210 L 175 240 L 150 255 L 180 295 L 140 280 Z" fill="#20F477" opacity="0.9"/>
</svg>